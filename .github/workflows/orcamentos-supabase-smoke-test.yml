name: orcamentos-app — Supabase smoke test

# Só manual (workflow_dispatch) — nunca em push/PR. O fieldservice-app
# (Serv) não tem CI/CD (ver CLAUDE.md secção 10); este workflow é
# deliberadamente isolado a orcamentos-app/ e não corre sozinho nunca.
on:
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orcamentos-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Build (com credenciais reais do Supabase)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.ORCAMENTOS_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.ORCAMENTOS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ORCAMENTOS_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Smoke test (schema, RLS, signup, storage)
        env:
          SUPABASE_URL: ${{ secrets.ORCAMENTOS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.ORCAMENTOS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ORCAMENTOS_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/smoke-test.mjs
